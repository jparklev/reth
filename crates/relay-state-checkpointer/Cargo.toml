[package]
name = "relay-state-checkpointer"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Phase 26.2: full plain-state checkpoint emitter — reads a local reth datadir, writes signed Vortex artifacts to an S3 bucket."

[[bin]]
name = "relay-state-checkpointer"
path = "src/main.rs"

[[bin]]
name = "shard_probe"
path = "src/bin/shard_probe.rs"

[[bin]]
name = "prod_probe"
path = "src/bin/prod_probe.rs"

[dependencies]
# Reth — re-use the EnvironmentArgs/AccessRights bootstrap from the
# existing CLI commands instead of re-deriving the 5-arg
# ProviderFactory::new wiring.
reth-cli-commands.workspace = true
reth-ethereum-cli.workspace = true
reth-provider.workspace = true
reth-db = { workspace = true }
reth-db-api.workspace = true
reth-storage-api.workspace = true
reth-primitives-traits.workspace = true
reth-node-types.workspace = true
reth-storage-errors.workspace = true
reth-node-ethereum.workspace = true
reth-tasks.workspace = true
# For the shard_probe diagnostic binary: re-use the bucket-state-client's
# public Vortex decoders to read shard chunks from disk cache.
reth-bucket-state-client = { path = "../bucket-state-client" }

# Vortex — same git fork the relay project uses, byte-equivalent
# column layouts shared with relay-rpc readers.
vortex = { git = "https://github.com/jparklev/vortex.git", branch = "develop", features = ["tokio", "files"] }
vortex-file = { git = "https://github.com/jparklev/vortex.git", branch = "develop" }
vortex-buffer = { git = "https://github.com/jparklev/vortex.git", branch = "develop" }

# Alloy primitives
alloy-consensus = { workspace = true, features = ["serde"] }
alloy-primitives = { workspace = true }

# Crypto / IO
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
sha2 = "0.10"
hex = "0.4"
object_store = { version = "0.13", features = ["aws"] }

# Async runtime + CLI
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
eyre = "0.6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
