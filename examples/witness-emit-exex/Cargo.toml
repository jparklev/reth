[package]
name = "example-witness-emit-exex"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "reth-witness-emit-node"
path = "src/main.rs"

[[bin]]
name = "witness-uploader"
path = "src/uploader.rs"
required-features = ["uploader"]

[dependencies]
# reth — `full` pulls in the witness feature on reth-revm via the rpc stack.
reth-ethereum = { workspace = true, features = ["full", "cli", "node"] }
reth-revm = { workspace = true, features = ["witness"] }
reth-engine-tree.workspace = true
reth-evm.workspace = true
reth-trie-common = { workspace = true, features = ["serde"] }
reth-storage-api.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-debug.workspace = true

# misc
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing.workspace = true
bincode.workspace = true
zstd.workspace = true
metrics.workspace = true

# Uploader-only deps.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"], optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"], optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
ed25519-dalek = { version = "2.2", optional = true }
hex = { version = "0.4", optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
metrics-util = { version = "0.20.0", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
sha2 = { workspace = true, features = ["std"], optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"], optional = true }

[features]
default = ["uploader"]
uploader = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-s3",
    "dep:chrono",
    "dep:ed25519-dalek",
    "dep:hex",
    "dep:metrics-exporter-prometheus",
    "dep:metrics-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:sha2",
    "dep:tracing-subscriber",
]
